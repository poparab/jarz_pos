name: CI

on:
  push:
    branches:
      - develop
  pull_request:

concurrency:
  group: develop-jarz_pos-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    name: Server

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:11.8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping -proot" --health-interval=5s --health-timeout=2s --health-retries=10

    steps:
      - name: Clone
        uses: actions/checkout@v4

      # Frappe and ERPNext version-16 need Python 3.14 and Node 24.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-py314-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-py314-pip-

      - name: Install MariaDB Client
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client

      - name: Setup
        run: |
          pip install frappe-bench
          bench init --frappe-branch version-16 --skip-redis-config-generation --skip-assets --python "$(which python)" ~/frappe-bench
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"

      - name: Install
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app --branch version-16 --skip-assets erpnext
          bench get-app --skip-assets jarz_pos $GITHUB_WORKSPACE
          bench setup requirements --dev
          bench new-site --db-root-password root --admin-password admin --install-app erpnext test_site
          bench --site test_site install-app jarz_pos
        env:
          CI: 'Yes'

      # The same curated module list as backend-tests.yml, read from that file so the
      # two never drift. --skip-before-tests matches the staging run.
      - name: Run Tests
        working-directory: /home/runner/frappe-bench
        run: |
          set -uo pipefail
          bench --site test_site set-config allow_tests true
          mapfile -t MODULES < <(sed -n '/MODULES=(/,/^ *)$/p' "$GITHUB_WORKSPACE/.github/workflows/backend-tests.yml" | grep -oE '^ +test_[A-Za-z0-9_]+' | tr -d ' ')
          echo "Running ${#MODULES[@]} modules"
          [ "${#MODULES[@]}" -gt 0 ] || exit 1
          failed=()
          for m in "${MODULES[@]}"; do
            echo "::group::${m}"
            bench --site test_site run-tests --app jarz_pos --module "jarz_pos.tests.${m}" --skip-before-tests || failed+=("${m}")
            echo "::endgroup::"
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "Failed modules (${#failed[@]}): ${failed[*]}"
            exit 1
          fi
        timeout-minutes: 60
        env:
          TYPE: server
